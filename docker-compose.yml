services:
  algae-agent:
    build: .
    image: algae-agent
    container_name: algae_agent_app
    env_file: .env
    ports:
      - "${ALGAE_AGENT_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - type: bind
        source: ./app
        target: /app/app
      - type: bind
        source: ./data
        target: /app/data

  algae-frontend:
    image: algae-agent
    container_name: algae_agent_frontend
    depends_on:
      algae-agent:
        condition: service_healthy
    restart: unless-stopped
    environment:
      BACKEND_URL: http://algae-agent:8000
    ports:
      - "${ALGAE_FRONTEND_PORT:-8501}:8501"
    command: ["streamlit", "run", "frontend/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    volumes:
      - type: bind
        source: ./frontend
        target: /app/frontend
