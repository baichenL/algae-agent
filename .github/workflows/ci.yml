name: CI

on:
  push:
  pull_request:

jobs:
  ubuntu-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - run: python scripts/run_scientific_eval.py

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_agent_runtime_graph.py tests/test_tool_metadata_policy.py tests/test_scientific_closed_loop.py
      - run: python scripts/run_scientific_eval.py
