name: CI

on:
  push:
  pull_request:

jobs:
  docker-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
        env:
          ALGAE_FRONTEND_API_KEY: replace-viewer-key
      - run: docker build --check .

  ubuntu-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_rag_encoding.py
      - run: pytest -q
      - run: python scripts/run_scientific_eval.py
      - run: python scripts/run_eval_showcase.py --output-dir data/eval_reports --skip-capture
      - run: python scripts/check_eval_summary.py
      - uses: actions/upload-artifact@v4
        with:
          name: deterministic-evaluation-report
          path: |
            data/eval_reports/latest.json
            data/eval_reports/latest.html
            data/eval_reports/latest.md

  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q tests/test_agent_runtime_graph.py tests/test_tool_metadata_policy.py tests/test_scientific_closed_loop.py
      - run: python scripts/run_scientific_eval.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          standalone: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
